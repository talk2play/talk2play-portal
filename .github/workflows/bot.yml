name: Bot del portal

on:
  schedule:
    - cron: "30 8 * * *"   # 08:30 UTC = 10:30 en España (invierno 09:30)
  workflow_dispatch: {}     # botón "Run workflow" en la pestaña Actions

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vídeos del canal
        run: python scripts/update.py

      - name: Lanzamientos de Steam
        run: python scripts/lanzamientos.py

      - name: Radar de temas
        run: python scripts/temas.py

      - name: Foto de métricas
        run: python scripts/metricas.py

      - name: Gate
        run: python scripts/check.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "talk2play-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/videos.js data/lanzamientos.js data/temas.js data/metricas.js
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Bot: actualiza vídeos, lanzamientos, temas y métricas"
            git push
          fi
